name: Test Build on Pull Request

on:
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    env:
      VITE_FRONTEND_URL: https://mmh.lilyinsight.ai
      VITE_BACKEND_URL: https://mmh-prod-backend.lilyinsight.ai/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22' # version nodejs 22
          cache: 'npm' # Enable caching for npm

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Report build status
        if: failure()
        run: echo "The build failed. Please fix the errors before merging."
